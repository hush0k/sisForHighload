syntax = "proto3";

package counter.v1;

option java_multiple_files = true;
option java_package = "kz.kbtu.sisforhighload.grpc.proto";
option java_outer_classname = "PostCounterProto";

service PostCounter {
  rpc LikePost(PostRequest) returns (Ack);
  rpc UnlikePost(PostRequest) returns (Ack);
  rpc StartView(PostRequest) returns (StartViewReply);
  rpc FinishView(FinishViewRequest) returns (Ack);
  rpc GetCounters(PostRequest) returns (CountersReply);
  rpc BatchGetCounters(BatchCountersRequest) returns (BatchCountersReply);
}

message PostRequest {
  int64 post_id = 1;
}

message FinishViewRequest {
  int64 post_id = 1;
  string view_token = 2;
}

message StartViewReply {
  string view_token = 1;
}

message CountersReply {
  int64 post_id = 1;
  int64 likes = 2;
  int64 views = 3;
  bool liked_by_me = 4;
}

message BatchCountersRequest {
  repeated int64 post_ids = 1;
}

message BatchCountersReply {
  repeated CountersReply counters = 1;
}

message Ack {
}