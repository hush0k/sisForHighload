spring:
  application:
    name: sisforhighload
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: jdbc:postgresql://localhost:5432/sisforhighload
    username: sis
    password: sis
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}

tuning:
  stage: 0
  pool-size: 10
  replica-url:

counter:
  min-view-duration: 2s
  view-dedup-ttl: 1h

grpc:
  port: 9090

fault:
  enabled: false
  failure-rate: 0.2
  slow-response-rate: 0.1
  slow-response-delay: 500ms
